name: apply

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to apply (check its plan.yml run first)"
        required: true
        type: string

jobs:
  apply:
    runs-on: [self-hosted]
    steps:
      - name: Sync all repos
        run: sync-repos.sh

      - name: tofu apply
        run: cluster-cli tofu cluster-ci --tag "${{ inputs.tag }}" apply -auto-approve
