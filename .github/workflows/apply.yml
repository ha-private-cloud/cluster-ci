name: apply

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to apply (check its plan.yml run first)"
        required: true
        type: string

jobs:
  apply:
    runs-on: [self-hosted]
    steps:
      - name: Sync repo checkout to this tag
        run: |
          git -C "$HOME/project/cluster-ci" fetch origin --tags

      - name: Keep cluster-cli up to date
        run: uv tool install --editable "$HOME/project/cluster-cli" --reinstall --quiet

      - name: tofu apply
        run: cluster-cli tofu cluster-ci --tag "${{ inputs.tag }}" apply -auto-approve
