name: deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to apply (check its plan run first)"
        required: true
        type: string

jobs:
  deploy:
    uses: ha-private-cloud/pipelines/.github/workflows/tofu-deploy.yml@main
    with:
      repo: cluster-ci
      tag: ${{ inputs.tag || github.ref_name }}
      apply: ${{ github.event_name == 'workflow_dispatch' }}
