name: deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to apply (check its plan run first)"
        required: true
        type: string

jobs:
  plan:
    if: github.event_name == 'push'
    runs-on: [self-hosted]
    steps:
      - name: Sync all repos
        run: sync-repos.sh

      - name: tofu plan
        run: cluster-cli tofu cluster-ci --tag "${{ github.ref_name }}" plan

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted]
    steps:
      - name: Sync all repos
        run: sync-repos.sh

      - name: tofu apply
        run: cluster-cli tofu cluster-ci --tag "${{ inputs.tag }}" apply -auto-approve
