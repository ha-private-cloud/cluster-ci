name: plan

on:
  push:
    tags: ["v*.*.*"]

jobs:
  plan:
    runs-on: [self-hosted]
    steps:
      - name: Sync repo checkout to this tag
        run: |
          git -C "$HOME/project/cluster-ci" fetch origin --tags

      - name: Keep cluster-cli up to date
        run: |
          git -C "$HOME/project/cluster-cli" pull --ff-only origin main
          uv tool install --editable "$HOME/project/cluster-cli" --reinstall --quiet

      - name: tofu plan
        run: cluster-cli tofu cluster-ci --tag "${{ github.ref_name }}" plan
